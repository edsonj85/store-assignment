name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Compile
        run: ./gradlew assemble

      - name: Spotless
        run: ./gradlew spotlessCheck

      - name: Checkstyle
        run: ./gradlew checkstyleMain

      - name: SpotBugs
        run: ./gradlew spotbugsMain

      - name: Unit tests
        run: ./gradlew test

      # data-load.sql isn't committed (see utils/README.md) - the integration
      # tests need it for the "load" profile, so generate it fresh here.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: utils/package-lock.json

      - name: Generate load-test data
        working-directory: utils
        run: |
          npm ci
          node generateData.js > ../src/main/resources/db/changelog/data-load.sql

      # ubuntu-latest ships Docker preinstalled and running, which is all
      # Testcontainers needs - no extra runner setup required.
      - name: Integration tests
        run: ./gradlew integrationTest

      # jacocoTestReport depends on integrationTest and genuinely re-runs it
      # (Testcontainers-backed tests aren't cacheable as UP-TO-DATE the way
      # plain unit tests are) - it needs data-load.sql just as much as the
      # step above, so the cleanup has to wait until everything that could
      # still trigger a re-run is done.
      - name: Coverage report
        run: ./gradlew jacocoTestReport

      # Only meaningful on a PR - it diffs against the PR's changed lines.
      # continue-on-error is a jacoco-report input, defaulting to true (report
      # only); set false here so it actually fails the job below threshold.
      - name: Coverage gate on changed files
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-changed-files: 70
          continue-on-error: false

      - name: Remove generated load-test data
        if: always()
        run: rm -f src/main/resources/db/changelog/data-load.sql

  # GitHub's own dependency graph diff - no API keys, no CVE database to
  # download, and it fails on exactly what changed in the PR rather than
  # every pre-existing dependency in the project.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high

  liquibase-rollback:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_DB: store
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Apply changelog to an empty schema
        run: ./gradlew update

      - name: Confirm the changesets actually applied
        env:
          PGPASSWORD: admin
        run: |
          tables=$(psql -h localhost -U admin -d store -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'")
          echo "tables after update: $tables"
          test "$tables" -gt 0

      # db.changelog-master.yaml currently chains 8 changesets (product/order-product
      # were the last ones added) - bump this if a new one lands.
      - name: Roll back every changeset
        run: ./gradlew rollbackCount -PliquibaseCommandValue=8

      - name: Confirm rollback actually left an empty schema
        env:
          PGPASSWORD: admin
        run: |
          tables=$(psql -h localhost -U admin -d store -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public' and table_name not like 'databasechangelog%'")
          echo "tables after rollback: $tables"
          test "$tables" -eq 0

  image:
    needs: [verify, liquibase-rollback]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build image
        run: ./gradlew bootBuildImage --imageName=ghcr.io/${{ github.repository_owner }}/store-assignment:${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/store-assignment:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA above, never "latest" - a rollback means
      # pointing the deploy at a previous SHA, not guessing what "latest" was.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push ghcr.io/${{ github.repository_owner }}/store-assignment:${{ github.sha }}
