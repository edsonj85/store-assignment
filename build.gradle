plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.3'
    id 'org.liquibase.gradle' version '2.2.0'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.25'
    id 'jacoco'
}

group = 'com.example'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Populates /actuator/info (name/version/build time) - otherwise an empty {}.
springBoot {
    buildInfo()
}

// Cloud Native Buildpacks image, not a hand-written Dockerfile - layered,
// non-root, and the bundled memory calculator sizes the heap from the
// container's actual memory limit at startup instead of a value baked in
// at build time, so resizing the container needs no rebuild.
tasks.named('bootBuildImage') {
    imageName = "store-main:${project.version}"
}

spotless {
    java {
        palantirJavaFormat('2.50.0')
                .style('PALANTIR')
                .formatJavadoc(true)
        importOrder('com', 'jakarta', 'lombok', 'org', '', 'javax|java', '\\#')
        removeUnusedImports()
        formatAnnotations()
    }
}

checkstyle {
    toolVersion = '10.20.2'
    configFile = file('config/checkstyle/checkstyle.xml')
}

// Only the main source set - test code doesn't need the same bug-pattern bar
// as what actually ships, and running it against test fixtures mostly finds
// noise (mock setup, assertion chains) rather than real defects.
tasks.named('checkstyleTest') {
    enabled = false
}

spotbugs {
    toolVersion = '4.8.6'
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.named('spotbugsTest') {
    enabled = false
}

tasks.spotbugsMain {
    reports.create('html') {
        required = true
    }
}

liquibase {
    activities {
        main {
            changelogFile 'db/changelog/db.changelog-master.yaml'
            searchPath 'src/main/resources'
            url project.findProperty('liquibaseUrl') ?: 'jdbc:postgresql://localhost:5432/store'
            username project.findProperty('liquibaseUsername') ?: 'admin'
            password project.findProperty('liquibasePassword') ?: 'admin'
        }
    }
    runList = 'main'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.mapstruct:mapstruct:1.6.2'
    implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

    // Test dependencies
    testCompileOnly 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.atlassian.oai:swagger-request-validator-mockmvc:2.44.9'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

    liquibaseRuntime 'org.liquibase:liquibase-core'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.6'
}

// Fast tests only (mocked/@WebMvcTest, no Docker) - the Testcontainers-backed
// ones are tagged "integration" and run separately below, so a pipeline can
// fail on these before paying for a container startup.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the Testcontainers-backed integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.test
    // The seeded data.sql changeset (~135k statements) needs more than the JVM
    // default heap for Liquibase to parse it when applying against the
    // Testcontainers-backed integration tests.
    maxHeapSize = '4g'
}

tasks.named('check') {
    dependsOn tasks.integrationTest
}

tasks.jacocoTestReport {
    dependsOn tasks.test, tasks.integrationTest

    reports {
        html.required.set(true)
        xml.required.set(true)
    }
    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it,
                    exclude: ['**/mapper/**', '**/StoreApplication.class'])
        })
    }
}