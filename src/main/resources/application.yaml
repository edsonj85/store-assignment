spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/store?reWriteBatchedInserts=true
    username: admin
    password: admin
    hikari:
      minimum-idle: 10
      maximum-pool-size: 10
      connection-timeout: 3000
      keepalive-time: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
management:
  endpoints:
    web:
      exposure:
        # Explicit allowlist, not "*" - no env/beans/heapdump/shutdown exposed.
        include: health,info,metrics,prometheus
logging:
  pattern:
    # Threads MDC correlationId (CorrelationIdFilter) into every log line.
    correlation: '[%X{correlationId:-}] '