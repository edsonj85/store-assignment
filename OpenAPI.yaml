openapi: 3.0.0
info:
  title: store
  version: '1.0'
  description: A simple store
  contact:
    name: SecuritEase Dev
    url: 'https://www.securitease.com'
    email: internal@securitease.com
  termsOfService: 'https://www.securitease.com'
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.htm'
servers:
  - url: 'http://localhost:8080'
    description: dev
paths:
  /order:
    get:
      summary: Get Orders
      tags:
        - store
      parameters:
        - name: page
          in: query
          description: 1-indexed page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Page size, capped server-side
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          description: Bad Request — page < 1 or size outside 1-100
      operationId: getOrders
      description: Get all orders, paginated
    post:
      summary: Create Order
      tags:
        - store
      responses:
        '201':
          description: Created
        '400':
          description: >-
            Bad Request — description blank, customer or products missing, or
            zero products supplied
        '404':
          description: Not Found — customer or a referenced product does not exist
      operationId: createOrder
      description: Create a new order with one or more products
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - description
                - customer
                - products
              properties:
                description:
                  type: string
                customer:
                  type: object
                  required:
                    - id
                  properties:
                    id:
                      type: integer
                      format: int64
                products:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        format: int64
  /order/{id}:
    get:
      summary: Get Order By Id
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not Found — no order exists with the given ID
        '400':
          description: Bad Request — id is not a valid integer
      operationId: getOrderById
      description: Get a single order by ID, including its customer and products
  /customer:
    get:
      summary: Get Customers
      tags:
        - store
      parameters:
        - name: name
          in: query
          description: >-
            Case-insensitive substring search on customer name, matching
            anywhere within a word (e.g. "erw" matches "Merwe"). Multiple
            whitespace-separated words are ANDed together, each matched
            independently. Must be at most 100 characters overall, and each
            individual word must be at least 3 characters. Omitted or blank
            falls back to the unfiltered paginated list below.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: 1-indexed page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Page size, capped server-side
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          description: >-
            Bad Request — page < 1, size outside 1-100, name longer than 100
            characters, or (when name is non-blank) name or any individual
            word within it shorter than 3 characters
      operationId: getCustomers
      description: >-
        Get customers, paginated. Pass name to search by name instead of
        listing all customers.
    post:
      summary: Create Customer
      tags:
        - store
      responses:
        '201':
          description: Created
      operationId: createCustomer
      description: Create a new customer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
  /products:
    get:
      summary: Get Products
      tags:
        - store
      parameters:
        - name: page
          in: query
          description: 1-indexed page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          description: Page size, capped server-side
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Bad Request — page < 1 or size outside 1-100
      operationId: getProducts
      description: Get all products, paginated, each with the IDs of orders containing it
    post:
      summary: Create Product
      tags:
        - store
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the newly created product
              schema:
                type: string
                format: uri
      operationId: createProduct
      description: Create a new product
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - description
              properties:
                description:
                  type: string
  /products/{id}:
    get:
      summary: Get Product By Id
      tags:
        - store
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not Found — no product exists with the given ID
        '400':
          description: Bad Request — id is not a valid integer
      operationId: getProductById
      description: Get a single product by ID, including the IDs of orders containing it
components:
  schemas:
    OrderPage:
      title: OrderPage
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    CustomerPage:
      title: CustomerPage
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ProductPage:
      title: ProductPage
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Product:
      title: Product
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        orders:
          type: array
          items:
            type: integer
            format: int64
    Order:
      title: Order
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        customer:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
    Customer:
      title: Customer
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        orders:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              description:
                type: string
                x-stoplight:
                  id: mq08x82g95zl9
tags:
  - name: store
    description: store operations
